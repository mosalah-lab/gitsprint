<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX App — Convert</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand"><span class="fx">FX</span> App</span>
    <nav class="menu">
      <a href="/">Welcome</a>
      <a href="/currencies.html">Currencies</a>
      <a href="/rates.html">Rates</a>
      <a href="/convert.html" class="active">Convert</a>
      <a href="#" class="todo">History</a>
    </nav>
  </header>

  <main>
    <h1>Convert &amp; see the fee</h1>
    <p class="lede">
      Pick a pair, enter an amount — <span class="mono">GET /api/convert</span> uses the latest
      rate and the retail fee tiers to show the converted amount, fee, and total.
    </p>

    <div class="panel">
      <form id="convert-form" autocomplete="off">
        <input name="base" maxlength="3" placeholder="Base (e.g. EUR)" required style="text-transform:uppercase">
        <input name="quote" maxlength="3" placeholder="Quote (e.g. USD)" required style="text-transform:uppercase">
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount (e.g. 100)" required>
        <button type="submit">Convert</button>
      </form>
      <p id="convert-status" class="status"></p>

      <table id="result-table" style="display:none">
        <tbody>
          <tr><th>Amount</th><td id="r-amount"></td></tr>
          <tr><th>Rate</th><td id="r-rate"></td></tr>
          <tr><th>Converted</th><td id="r-converted"></td></tr>
          <tr><th>Fee</th><td id="r-fee"></td></tr>
          <tr><th>Total</th><td id="r-total"></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/convert.js"></script>
</body>
</html>
